```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RBXSender</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f4f4;
      color: #191919;
      min-height: 100vh;
    }

    .topbar {
      height: 64px;
      background: #111;
      display: flex;
      align-items: center;
      padding: 0 32px;
      color: white;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
    }

    .container {
      width: min(1050px, calc(100% - 32px));
      margin: 45px auto;
    }

    .header {
      margin-bottom: 25px;
    }

    .header h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .header p {
      color: #666;
      font-size: 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
    }

    .card {
      background: white;
      border: 1px solid #dedede;
      border-radius: 10px;
      padding: 28px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.05);
    }

    .card h2 {
      font-size: 19px;
      margin-bottom: 22px;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      height: 45px;
      border: 1px solid #cfcfcf;
      border-radius: 7px;
      padding: 0 13px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #777;
    }

    .amount-wrapper {
      position: relative;
    }

    .amount-wrapper span {
      position: absolute;
      left: 13px;
      top: 13px;
      font-weight: 700;
      color: #555;
    }

    .amount-wrapper input {
      padding-left: 30px;
    }

    button {
      width: 100%;
      height: 46px;
      border: none;
      border-radius: 7px;
      background: #191919;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }

    button:hover {
      opacity: 0.88;
    }

    button:active {
      transform: scale(0.99);
    }

    .status {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 7px;
      background: #f1f1f1;
      font-size: 14px;
    }

    .status.visible {
      display: block;
    }

    .status-title {
      font-weight: 700;
      margin-bottom: 5px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
      border-bottom: 1px solid #ededed;
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .user {
      font-weight: 600;
      font-size: 14px;
    }

    .date {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }

    .amount {
      font-weight: 700;
      font-size: 14px;
    }

    .notice {
      margin-top: 22px;
      padding: 12px 15px;
      background: #fafafa;
      border: 1px solid #e3e3e3;
      border-radius: 7px;
      color: #777;
      font-size: 12px;
      line-height: 1.5;
    }

    footer {
      text-align: center;
      color: #999;
      font-size: 12px;
      padding: 30px 0;
    }

    @media (max-width: 760px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .container {
        margin-top: 30px;
      }

      .topbar {
        padding: 0 20px;
      }
    }
  </style>
</head>

<body>

  <div class="topbar">
    <div class="logo">RBXSender</div>
  </div>

  <main class="container">

    <div class="header">
      <h1>Send Robux</h1>
      <p>Enter a username and amount below.</p>
    </div>

    <div class="grid">

      <section class="card">
        <h2>Send Robux</h2>

        <div class="field">
          <label for="username">Username</label>

          <input
            id="username"
            type="text"
            placeholder="Enter username"
            autocomplete="off"
          >
        </div>

        <div class="field">
          <label for="amount">Amount</label>

          <div class="amount-wrapper">
            <span>R$</span>

            <input
              id="amount"
              type="number"
              min="1"
              placeholder="0"
            >
          </div>
        </div>

        <button onclick="sendRobux()">
          Send Robux
        </button>

        <div class="status" id="status">
          <div class="status-title" id="statusTitle"></div>
          <div id="statusText"></div>
        </div>
      </section>

      <section class="card">

        <h2>Recent Activity</h2>

        <div class="history">

          <div class="history-item">
            <div>
              <div class="user">PlayerOne</div>
              <div class="date">Today</div>
            </div>

            <div class="amount">R$ 250</div>
          </div>

          <div class="history-item">
            <div>
              <div class="user">BuilderMax</div>
              <div class="date">Today</div>
            </div>

            <div class="amount">R$ 500</div>
          </div>

          <div class="history-item">
            <div>
              <div class="user">PixelMaster</div>
              <div class="date">Yesterday</div>
            </div>

            <div class="amount">R$ 100</div>
          </div>

        </div>

        <div class="notice">
          This is an independent fictional interface and is not
          affiliated with Roblox Corporation.
        </div>

      </section>

    </div>

  </main>

  <footer>
    RBXSender
  </footer>

  <script>
    function sendRobux() {
      const username =
        document.getElementById("username").value.trim();

      const amount =
        document.getElementById("amount").value;

      const status =
        document.getElementById("status");

      const statusTitle =
        document.getElementById("statusTitle");

      const statusText =
        document.getElementById("statusText");

      if (!username || !amount || Number(amount) <= 0) {
        status.classList.add("visible");

        statusTitle.textContent =
          "Missing information";

        statusText.textContent =
          "Please enter a username and a valid amount.";

        return;
      }

      status.classList.add("visible");

      statusTitle.textContent =
        "Processing...";

      statusText.textContent =
        "Preparing the transfer interface.";

      setTimeout(() => {
        statusTitle.textContent =
          "Completed";

        statusText.textContent =
          `The simulated transfer of R$ ${amount} to ${username} has been completed.`;
      }, 1800);
    }
  </script>

</body>
</html>
```
